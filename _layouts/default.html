<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
  {% include head.html %}
</head>
<body class="pt-{{ page.layout | default: 'page' }}">

  {% include icons.html %}

  {% if page.layout == 'post' %}
    <div aria-hidden="true" class="progress"><span></span></div>
  {% endif %}

  <button aria-label="Volver arriba" class="back-to-top" id="back-to-top">
    <svg viewBox="0 0 24 24"><use href="#i-up"/></svg>
  </button>

  {% include sidebar.html %}

  <div class="page">
    <main class="main" id="main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>

  {% include scripts.html %}
</body>
</html>
