<div class="share">
  <span class="share-label">Compartir</span>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url }}" target="_blank" rel="noopener nofollow">LinkedIn</a>
  <a href="https://x.com/intent/post?url={{ page.url | absolute_url }}&text={{ page.title | uri_escape }}" target="_blank" rel="noopener nofollow">X</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url }}" target="_blank" rel="noopener nofollow">Facebook</a>
  <button data-copy-link="data-copy-link" type="button">Copiar enlace</button>
</div>
