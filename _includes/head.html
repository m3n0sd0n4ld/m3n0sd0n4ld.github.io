{% assign title = page.title | default: site.title | escape %}
{% assign description = page.description | default: site.description | strip_html | strip_newlines | truncate: 160 %}
{% assign image = page.image | default: site.author.image %}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#222222">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
{% if image %}<meta property="og:image" content="{{ image | absolute_url }}">{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon">
