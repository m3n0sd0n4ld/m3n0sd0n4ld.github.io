### Site Settings ###
title: m3n0sd0n4ld
description: Crónicas Cuacfantásticas del Pato Suertudo.
url: "https://m3n0sd0n4ld.github.io"
baseurl: ""
repository: m3n0sd0n4ld/m3n0sd0n4ld.github.io
theme: null

# Paginación (necesaria para el listado de posts)
paginate: 6
paginate_path: "/patoHackventuras/page:num/"

plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-paginate   # añade este plugin

# Navegación (la usaremos en la sidebar)
nav_exclude:
  - pages/tags.html
  - pages/404.html
  - pages/index.md

author:
  name: David Utón
  image: https://avatars.githubusercontent.com/u/54067582?v=4
  github: m3n0sd0n4ld
  linkedin: david-uton
  twitter: David_Uton

permalink: /patoHackventuras/:title

collections:
  projects:
    output: true
    permalink: /mickey-tools/:name

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false